# Publishes grain's lexicons as atproto resolves them, once main's test
# and check pass at a commit that changes them (deploy/publish-lexicons.mjs):
# a com.atproto.lexicon.schema record in grain.social's repo for each
# social.grain.* lexicon, and the `_lexicon.<authority>` TXT records in the
# grain.social zone naming that account. What is new or changed is
# written, and what main no longer has is deleted. Each run makes the
# whole set match main, so a run cut off by a newer one leaves nothing the
# next does not finish.
#
# A PDS that validates records reads these schemas, not lexicons/, so a
# stale one here rejects writes the appview accepts.
#
# It runs on ci.knotless.dev alone, like deploy. LEX_PASSWORD is an app
# password of grain.social, sealed to pushes to main (`knotless secret
# knotless://grain.social/grain set LEX_PASSWORD --runner ci.knotless.dev
# --ref refs/heads/main`). CLOUDFLARE_API_TOKEN, with Zone:DNS:Edit on
# grain.social, is needed only when an authority is added or dropped;
# without it the schemas are still written and the run fails, naming the
# records to make.
#
# Asked for on any other branch, `knotless rerun
# knotless://grain.social/grain --ref refs/heads/<branch> --workflow
# publish-lexicons`, it says what it would change and changes nothing.
on:
  push: { refs: [refs/heads/main], paths: [lexicons/social/**, deploy/publish-lexicons.mjs] }
  asked: { refs: [refs/heads/*] }
image: node:24.22.1
runners: [ci.knotless.dev]
secrets: [LEX_PASSWORD, CLOUDFLARE_API_TOKEN]
env:
  LEX_DID: did:plc:e7rftrdyz5e2rw4y6ocszew2
  LEX_ZONE: grain.social
  # Cloudflare refuses a token limited to an address over IPv6.
  NODE_OPTIONS: --dns-result-order=ipv4first
steps:
  - name: plan
    run: node deploy/publish-lexicons.mjs
  - name: checks
    timeout: 30
    run: |
      [ "$KNOTLESS_RUN_REF" = refs/heads/main ] || exit 0
      curl -fsSL https://knotless.dev/install.sh | KNOTLESS_INSTALL_DIR=/usr/local/bin sh
      repo="knotless://$KNOTLESS_RUN_REPO"
      end=$(($(date +%s) + 1500))
      for wf in test check; do
        left=$((end - $(date +%s)))
        [ "$left" -gt 0 ] || left=1
        out=$(knotless checks "$repo" --ref "$KNOTLESS_RUN_REF" --commit "$KNOTLESS_RUN_SHA" --workflow "$wf" --wait "$left")
        echo "$out"
        case "$out" in success*) ;; *) echo "$wf has not passed: not publishing"; exit 1 ;; esac
      done
  - name: publish
    run: |
      [ "$KNOTLESS_RUN_REF" = refs/heads/main ] || exit 0
      node deploy/publish-lexicons.mjs --write

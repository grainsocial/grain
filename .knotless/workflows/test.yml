# The unit tests, as `npm test` runs them. The live spaces tests skip
# themselves without SPACES_LIVE=1, and the Playwright tests in test/browser
# are not run here. The packages are kept between runs and installed again
# only when the lockfile changes (the npm-ci shared step).
image: node:25-slim
runners: [runner.knotless.dev]
on:
  push: { refs: [refs/heads/main] }
  pull: { base: [refs/heads/main] }
cache: [node_modules]
steps:
  - uses: chadtmiller.com/steps/npm-ci@1
  - name: test
    run: npm test

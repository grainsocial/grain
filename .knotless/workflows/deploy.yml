# Deploys main to grain's Hetzner host once this commit's checks all pass:
# check and test, the Rust workspace's lint and tests, web, the pages'
# checks, and lexicons, so that no part can fail and still deploy. It runs
# deploy/deploy.sh over SSH, as a deploy from one's own checkout does
# (deploy/README.md), with the settings below in place of deploy/local.env.
#
# deploy.sh writes the host's /etc/grain-serve/.env from its environment,
# whole, each time: a setting left out here is unset there. The secrets
# are not among them: they are in /etc/grain-serve/serve.env on the host.
#
# The image is built from this checkout on the host, as a candidate,
# grain-serve:build-<commit>, while the checks run (deploy.sh build), which
# changes nothing that runs. Once they pass it becomes grain-serve:current
# and serve and the pages roll over to it with no downtime (deploy.sh up).
# A check that fails removes the candidate (deploy.sh drop) and fails the
# run. When main has moved past this commit by the time the checks pass,
# the candidate is removed and the run passes: the newer commit deploys.
# Once a deploy starts it finishes; a newer one waits for it (superseded:
# finish).
#
# It runs on ci.knotless.dev alone, the runner on knotless.dev's own host,
# so the key never reaches the hosted runner that checks pulls. There
# DEPLOY_SSH_KEY is sealed to pushes to main alone (`knotless secret
# knotless://grain.social/grain set DEPLOY_SSH_KEY --runner ci.knotless.dev
# --ref refs/heads/main`). Its public half is in root's authorized_keys on
# the host.
on:
  push: { refs: [refs/heads/main] }
superseded: finish
image: docker:28-cli
runners: [ci.knotless.dev]
secrets: [DEPLOY_SSH_KEY]
env:
  GRAIN_HOST: root@167.233.237.163
  GRAIN_DOMAIN: grain.social
  # grain's imgproxy, through Bunny.
  GRAIN_CDN: https://cdn.grain.social
  # The accounts, by DID, that moderate.
  GRAIN_ADMIN_DIDS: did:plc:bcgltzqazw5tb6k2g3ttenbj
  # Push, with the key files serve.env names under /mnt/data/grain-serve/certs.
  GRAIN_APNS_KEY_ID: J53A95HDW7
  GRAIN_APNS_TEAM_ID: YN68LN9T7Z
  GRAIN_APNS_TOPIC: social.grain.grain
  GRAIN_FCM_PROJECT_ID: grain-android-4d6d5
  # Until when the web carries the session cookies browsers held before
  # grain-serve, which last 30 days (crates/grain-serve/src/login/carryover.rs).
  GRAIN_CARRY_COOKIES_UNTIL: "2026-12-15T00:00:00Z"
steps:
  - name: tools
    run: |
      apk add --no-cache bash curl openssh-client
      curl -fsSL https://knotless.dev/install.sh | KNOTLESS_INSTALL_DIR=/usr/local/bin sh
  - name: key
    run: |
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      printf 'Host *\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config
  - name: build
    timeout: 30
    run: deploy/deploy.sh build
  - name: checks done
    timeout: 30
    run: |
      # 25 minutes over all four, and never a failure: the next step
      # judges. Its checks can wait for a job behind other runs, so it
      # waits for them over two steps, each under the runner's 30 minutes
      # a step, as knotless's deploy does.
      repo="knotless://$KNOTLESS_RUN_REPO"
      end=$(($(date +%s) + 1500))
      for wf in check test web lexicons; do
        left=$((end - $(date +%s)))
        [ "$left" -gt 0 ] || break
        knotless checks "$repo" --ref "$KNOTLESS_RUN_REF" --commit "$KNOTLESS_RUN_SHA" --workflow "$wf" --wait "$left" || true
      done
  - name: checks pass
    timeout: 30
    run: |
      repo="knotless://$KNOTLESS_RUN_REPO"
      end=$(($(date +%s) + 1500))
      for wf in check test web lexicons; do
        left=$((end - $(date +%s)))
        [ "$left" -gt 0 ] || left=1
        out=$(knotless checks "$repo" --ref "$KNOTLESS_RUN_REF" --commit "$KNOTLESS_RUN_SHA" --workflow "$wf" --wait "$left")
        echo "$out"
        case "$out" in
          success*) ;;
          *)
            echo "$wf has not passed: not deploying"
            deploy/deploy.sh drop
            exit 1
            ;;
        esac
      done
  - name: deploy
    run: |
      refs=$(knotless refs "knotless://$KNOTLESS_RUN_REPO") || {
        echo "cannot tell where $KNOTLESS_RUN_REF is: not deploying"
        deploy/deploy.sh drop
        exit 1
      }
      tip=$(printf '%s\n' "$refs" | awk -F '\t' -v ref="$KNOTLESS_RUN_REF" '$2 == ref { print $1 }')
      if [ "$tip" != "$KNOTLESS_RUN_SHA" ]; then
        echo "$KNOTLESS_RUN_REF is at ${tip:-nothing} now, not $KNOTLESS_RUN_SHA: a newer commit will deploy"
        deploy/deploy.sh drop
        exit 0
      fi
      deploy/deploy.sh up

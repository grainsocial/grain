# Formatting, lint and types, as `npm run check` runs them: vp check, then
# svelte-check. The packages are kept between runs and installed again only
# when the lockfile changes (the npm-ci shared step).
image: node:25-slim
runners: [runner.knotless.dev]
on:
  push: { refs: [refs/heads/main] }
  pull: { base: [refs/heads/main] }
cache: [node_modules]
steps:
  - uses: chadtmiller.com/steps/npm-ci@1
  - name: check
    run: npm run check

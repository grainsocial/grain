# Formatting, lint and types, as `npm run check` runs them: vp check, then
# svelte-check. The packages are kept between runs and installed again only
# when the lockfile changes.
image: node:25-slim
runners: [runner.knotless.dev]
on:
  push: { refs: [refs/heads/main] }
  pull: { base: [refs/heads/main] }
cache: [node_modules]
steps:
  - name: packages
    run: |
      lock=$(sha256sum package-lock.json)
      [ "$(cat node_modules/.lock 2>/dev/null)" = "$lock" ] && exit 0
      npm ci --no-audit --no-fund
      echo "$lock" > node_modules/.lock
  - name: check
    run: npm run check
